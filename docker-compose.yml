services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: rag-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - cluster.routing.allocation.disk.threshold_enabled=false
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - ./localdata/elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./localdata/qdrant:/qdrant/storage
    healthcheck:
      # qdrant image is minimal and does not include curl/wget.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 20s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.26
    container_name: rag-neo4j
    environment:
      - NEO4J_AUTH=neo4j/change_me_local
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ./localdata/neo4j/data:/data
      - ./localdata/neo4j/logs:/logs
      - ./localdata/neo4j/plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:7474 >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 15

  # Embedding API (OpenAI-compatible /v1/embeddings) using Qwen3-Embedding-8B.
  # Note: on macOS Docker Desktop this runs on CPU; Metal/MPS is host-only.
  embedder:
    build:
      context: ./containers/qwen-embed
      dockerfile: Dockerfile
    container_name: rag-embedder
    profiles: ["embed"]
    environment:
      - HF_HOME=/models/hf
      - TRANSFORMERS_CACHE=/models/hf
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - TOKENIZERS_PARALLELISM=false
    ports:
      - "8001:8001"
    volumes:
      - hf-cache:/models/hf
    shm_size: "2gb"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 120

  # Optional UI for Elasticsearch, disabled unless profile is enabled.
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: rag-kibana
    profiles: ["kibana"]
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  hf-cache:
